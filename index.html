<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp Cưới | [Tên Chú Rể] & [Tên Cô Dâu]</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="invitation-wrapper">
        <div class="invitation-card">
            <p class="pre-title">Save The Date</p>
            <h1 class="names"> [Tên Chú Rể] <span>&</span> [Tên Cô Dâu]</h1>
            <p class="invite-text">Trân trọng kính mời tới dự bữa tiệc chung vui cùng gia đình chúng tôi</p>
            
            <div class="details">
                <div class="detail-item">
                    <p><strong>17:30 | Thứ Bảy</strong><br>Ngày 12 tháng 12 năm 2026</p>
                </div>
                <div class="detail-item">
                    <p><strong>Nhà hàng tiệc cưới [Tên]</strong><br>Khu vực AEON Mall Long Biên, Hà Nội</p>
                </div>
            </div>

            <button class="rsvp-btn" onclick="alert('Cảm ơn bạn đã xác nhận tham dự!')">Xác Nhận Tham Dự</button>
        </div>
    </div>
</body>
</html>
